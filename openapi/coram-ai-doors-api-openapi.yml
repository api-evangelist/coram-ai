openapi: 3.2.0
info:
  title: Coram Doors API
  description: '# Introduction


    The Coram API enables seamless programmatic access to your security camera infrastructure, allowing you to build custom integrations and automate workflows. # Supported Actions


    Manage and interact with your Coram platform resources:


    | Resource | Description |

    | -------- | ----------- |

    | **Camera Groups** | Organize and configure camera collections |

    | **Cameras** | Access camera settings, streams, and metadata |

    | **Locations** | Manage physical site configurations |

    | **NVRs** | Control and monitor network video recorders |

    | **Access Control** | Manage doors, cards, and permissions |


    ## Access Control


    Card and permission changes are saved before they reach controllers. If a request fails, check the saved state before retrying. # Required Headers


    Every API request must include the following headers:


    | Header | Required | Description |

    | ------ | -------- | ----------- |

    | `X-Auth-Token` | Yes | Your API key (from the API key List Page) |


    **Example:**

    ```

    curl -X GET "https://api.coram.ai/developer-api/v1/cameras" \

    -H "X-Auth-Token: xxxxxxxxxxxxxxx"

    ```


    # Response Format


    All API responses follow a consistent structure based on the operation result. ## Success Response


    **List Operations** (e.g., `GET /v1/cameras`)


    Returns a `results` array with pagination support:


    ```json

    {

    "results": [

    { "id": "cam_001", "name": "Front Door", ... },

    { "id": "cam_002", "name": "Lobby", ... }

    ],

    "has_more": true

    }

    ```


    When `has_more` is `true`, additional results are available. Use pagination parameters to fetch more. **Bulk/Batch Operations** (e.g., `POST /v1/cameras`, `PATCH /v1/cameras`)


    Returns a top-level `status` field indicating whether the API request was processed, and a `results` array where each item reflects the outcome of an individual operation:


    ```json

    {

    "status": "success",

    "results": [

    { "status": "success", "data": { "id": "cam_001", "mac_address": "..." } },

    { "status": "error", "error": { "code": "VALIDATION_ERROR", "message": "..." } }

    ]

    }

    ```


    | Field | Description |

    | ----- | ----------- |

    | `status` (top-level) | `"success"` if the request was processed |

    | `results[].status` | `"success"` or `"error"` for each operation |

    | `results[].data` | Present when `status` is `"success"` |

    | `results[].error` | Present when `status` is `"error"` |


    ## Error Response


    When an error occurs, the response includes `status` set to `"error"` along with detailed error information:


    ```json

    {

    "status": "error",

    "error": {

    "code": "VALIDATION_ERROR",

    "message": "Invalid MAC address format",

    "field": "mac_address"

    }

    }

    ```


    **Error Fields:**


    | Field | Type | Description |

    | ----- | ---- | ----------- |

    | `code` | string | Machine-readable error code |

    | `message` | string | Human-readable error description |

    | `field` | string | The field that caused the error (if applicable) |


    # HTTP Status Codes


    The API uses standard HTTP status codes to indicate the success or failure of requests:


    ## Success Codes


    | Code | Description |

    | ---- | ----------- |

    | `200 OK` | Request succeeded |

    | `201 Created` | Resource successfully created |

    | `204 No Content` | Request succeeded with no response body |


    ## Client Error Codes


    | Code | Description |

    | ---- | ----------- |

    | `400 Bad Request` | Invalid request syntax or parameters |

    | `401 Unauthorized` | Missing or invalid API key |

    | `403 Forbidden` | Valid API key but insufficient permissions |

    | `404 Not Found` | Requested resource does not exist |

    | `422 Unprocessable Entity` | Validation error in request body |

    | `429 Too Many Requests` | Rate limit exceeded |


    ## Server Error Codes


    | Code | Description |

    | ---- | ----------- |

    | `500 Internal Server Error` | Unexpected server error (rare) |

    | `502 Bad Gateway` | Upstream service unavailable |

    | `503 Service Unavailable` | Service temporarily unavailable |


    # Error Handling Best Practices


    1. **Always check the `status` field** — Verify if the response indicates `"success"` or `"error"`


    2.'
  version: 1.0.0
servers:
- url: https://developer.coram.ai
  description: Production
security:
- X-Auth-Token: []
tags:
- name: Doors
  description: List access control doors and trigger momentary remote unlocks. The same per-door permission checks the in-app unlock flow runs apply here — a key whose creator cannot unlock a door in the UI cannot unlock it via the API either.
paths:
  /v1/access-control/doors:
    get:
      operationId: list_access_control_doors
      summary: List access control doors
      description: 'Returns the doors the API key creator can see, with their online

        status. Admins see every door in the tenant; lower roles see only

        doors they have permission to unlock. Use `page` and `limit` to

        paginate; `has_more` on the response signals more pages remain.'
      tags:
      - Doors
      security:
      - X-Auth-Token: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-indexed page number.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Maximum doors per page (capped at 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoorList'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: API key lacks the required scope or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      x-public-api: true
      x-public-api-version: v1
  /v1/access-control/doors/{door_id}/unlock:
    post:
      operationId: unlock_access_control_door
      summary: Unlock an access control door
      description: 'Sends a momentary-unlock command to the door''s controller board.

        Requires `write:*` scope and an `admin` creator role. The same

        permission checks the in-app unlock flow runs are applied; an API key

        whose creator no longer has access to the door is rejected.'
      tags:
      - Doors
      security:
      - X-Auth-Token: []
      parameters:
      - in: path
        name: door_id
        required: true
        schema:
          type: integer
          format: int64
        description: ID of the door to unlock
      responses:
        '200':
          description: Unlock command issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockResponse'
        '400':
          description: Invalid door_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: API key lacks the required scope or role, or the creator cannot unlock this door
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      x-public-api: true
      x-public-api-version: v1
components:
  schemas:
    Door:
      type: object
      required:
      - id
      - name
      - location_id
      - is_online
      properties:
        id:
          type: integer
          format: int64
          description: Stable internal identifier of the door.
        name:
          type: string
          description: Human-readable door name as set in the Coram app.
        location_id:
          type: integer
          format: int64
          description: ID of the location this door belongs to. Zero when the door has no assigned location.
        is_online:
          type: boolean
          description: 'True if the door''s controller board has reported a heartbeat

            within the last 15 seconds.

            '
      x-public-api-group: doors
    AuthErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: 'Human-readable error description. Matches the shape FastAPI uses

            for `HTTPException` responses, so existing code that parses the

            Python developer-api''s auth errors works unchanged.

            '
    UnlockResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - success
          description: Always `success` on a 200; non-200 responses use AuthErrorResponse.
      x-public-api-group: doors
    DoorList:
      type: object
      required:
      - results
      - has_more
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Door'
        has_more:
          type: boolean
          description: 'Reserved for future pagination; always false today. The endpoint

            currently returns every door the caller can see.

            '
      x-public-api-group: doors
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
x-tagGroups:
- name: Surveillance
  tags:
  - cameras
  - camera-groups
  - locations
  - nvrs
  - alerts
- name: Access Control
  tags:
  - doors
  - credentials
  - events
  - permissions
- name: Emergency Management System
  tags:
  - reunification
