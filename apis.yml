aid: coram-ai
name: Coram Ai
description: >-
  Coram AI is an AI-native unified physical security platform that brings video
  surveillance, access control, emergency management, and visitor verification into a
  single cloud system that works with existing IP cameras. Its Developer API offers
  programmatic access to cameras, camera groups, NVRs, locations, access-control doors and
  events, and firearm-detection alerts, plus bulk school-reunification roster imports.
  Features include natural-language AI video search, firearm and fall detection, license
  plate and facial recognition, tailgating alerts, and remote door unlock. Coram is backed
  by 8VC and Battery Ventures.
