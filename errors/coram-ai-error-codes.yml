# Coram exposes a machine-readable error registry (ErrorCode enum) rather than
# RFC 9457 problem+json. Errors are returned in a JSON envelope with status/error.
format: coram-envelope
envelope:
  # Single-operation errors
  shape: '{ "status": "error", "error": { "code": "...", "message": "...", "field": "..." } }'
  fields:
    status: '"error" when the request failed'
    error.code: machine-readable code from the ErrorCode registry below
    error.message: human-readable description
    error.field: the request field that caused the error (when applicable)
    error.docs: link to error documentation (when provided)
  # Batch/bulk operations (POST/PATCH/DELETE /v1/cameras, etc.) return a top-level
  # status plus a results[] array where each item has its own status + error/data.
  batch_shape: '{ "status": "...", "results": [ { "status": "error", "error": { "code": "...", "message": "..." } } ] }'
http_status_codes:
  '200': Request succeeded
  '201': Resource successfully created
  '204': Request succeeded with no response body
  '400': Invalid request syntax or parameters
  '401': Missing or invalid API key
  '403': Valid API key but insufficient permissions (scope/role/feature)
  '404': Requested resource does not exist
  '409': Conflict (duplicate name, camera already assigned, import already running)
  '422': Validation error in request body
  '429': Rate limit exceeded — implement exponential backoff
  '500': Unexpected server error (rare)
  '502': Upstream service unavailable
  '503': Service temporarily unavailable
